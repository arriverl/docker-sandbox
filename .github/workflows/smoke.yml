name: Live Docker smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    name: Ubuntu live create/destroy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      DOCKER_SANDBOX_LIVE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true

      - name: Live smoke tests
        run: go test -mod=mod ./dockerx/ -run 'TestClient_LiveDaemonSkipIfUnavailable|TestOrchestrator_LiveCreateDestroy' -count=1 -timeout=10m
