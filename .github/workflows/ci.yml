name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      DOCKER_SANDBOX_LIVE: "0"
    steps:
      - name: Use LF checkouts
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.2"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            $unformatted
            throw "Go files are not formatted"
          }

      - name: Vet
        run: go vet -mod=mod ./...

      - name: Unit tests
        run: go test -count=1 -mod=mod ./...

      - name: Coverage
        shell: pwsh
        run: go test -count=1 "-coverprofile=coverage.out" -mod=mod ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: windows-coverage
          path: coverage.out
          if-no-files-found: error

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      DOCKER_SANDBOX_LIVE: "0"
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.2"
          cache: true

      - name: Race tests
        run: go test -race -count=1 -mod=mod ./...
